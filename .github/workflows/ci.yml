name: Agent and local console
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: '**/go.sum'
      - name: Unit and integration tests
        run: go test ./apps/agent/... ./packages/contracts/... ./tools/mock-server/...
      - name: Race detection
        if: runner.os != 'Windows'
        run: go test -race ./apps/agent/... ./packages/contracts/... ./tools/mock-server/...
      - name: Vet
        run: go vet ./apps/agent/... ./packages/contracts/... ./tools/mock-server/...
      - name: Build
        run: |
          go build -o bin/kiosentra-agent ./apps/agent/cmd/kiosentra-agent
          go build -o bin/mock-server ./tools/mock-server/cmd/mock-server
      - name: Independent update recovery smoke test
        if: runner.os != 'Windows'
        run: python3 scripts/phase6-smoke.py
      - name: Windows cross-build
        if: runner.os == 'Linux'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -o bin/kiosentra-agent.exe ./apps/agent/cmd/kiosentra-agent

  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/agent/frontend/package-lock.json
      - name: Frontend dependencies
        working-directory: apps/agent/frontend
        run: npm ci --ignore-scripts
      - name: Frontend build and tests
        working-directory: apps/agent/frontend
        run: |
          npm run build
          npm test
      - name: Windows desktop build
        if: runner.os == 'Windows'
        run: go build -tags desktop -ldflags="-H=windowsgui" -o bin/kiosentra-agent.exe ./apps/agent/cmd/kiosentra-agent
      - name: macOS desktop build
        if: runner.os == 'macOS'
        run: go build -tags desktop -o bin/kiosentra-agent ./apps/agent/cmd/kiosentra-agent
      - name: Desktop vet
        run: go vet -tags desktop ./apps/agent/internal/ui/... ./apps/agent/frontend/...
