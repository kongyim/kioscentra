name: Go foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: '**/go.sum'
      - name: Unit and integration tests
        run: go test ./apps/agent/... ./packages/contracts/... ./tools/mock-server/...
      - name: Race detection
        if: runner.os != 'Windows'
        run: go test -race ./apps/agent/... ./packages/contracts/... ./tools/mock-server/...
      - name: Vet
        run: go vet ./apps/agent/... ./packages/contracts/... ./tools/mock-server/...
      - name: Build
        run: go build ./apps/agent/cmd/kiosentra-agent ./tools/mock-server/cmd/mock-server
      - name: Windows cross-build
        if: runner.os == 'Linux'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -o bin/kiosentra-agent.exe ./apps/agent/cmd/kiosentra-agent
